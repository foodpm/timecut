name: Build and Push Docker Image

# 手动触发构建（GitHub Actions 页面点击「Run workflow」）
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # 导出镜像为 tar，作为 Release 附件，方便国内/离线用户 docker load 部署
      - name: Export image tarballs
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euxo pipefail
          IMAGE="ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
          mkdir -p artifacts
          for arch in amd64 arm64; do
            docker pull --platform "linux/$arch" "$IMAGE"
            docker save "$IMAGE" -o "artifacts/timecut-${arch}.tar"
          done

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            --title "TimeCut $GITHUB_REF_NAME" \
            --notes "Docker 镜像: \`ghcr.io/foodpm/timecut:$GITHUB_REF_NAME\`（支持 amd64 / arm64）\n\n离线部署: 下载对应架构的 \`timecut-<arch>.tar\`，执行 \`docker load -i timecut-<arch>.tar\` 导入镜像，再将 docker-compose.yml 中 \`image: ghcr.io/foodpm/timecut:latest\` 改为 \`image: ghcr.io/foodpm/timecut:$GITHUB_REF_NAME\` 后 \`docker compose up -d\`。\n\n普通部署方式见 README。" \
            artifacts/*.tar \
            || true
