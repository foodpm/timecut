<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>添加摄像头</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #cbd5e1; padding: 20px 20px 32px; overflow-y: auto; }
h2 { color: #f1f5f9; font-size: 17px; font-weight: 600; margin-bottom: 16px; }

/* 品牌选择按钮 */
.brand { display: flex; align-items: center; justify-content: space-between; width: 100%; background: #1e293b; color: #e2e8f0; cursor: pointer; padding: 14px 16px; border: 1px solid #334155; border-radius: 10px; text-align: left; font-size: 14px; font-weight: 600; margin-bottom: 10px; transition: all .15s; }
.brand:hover { background: #334155; }
.brand.active { border-color: #2563eb; background: #1e293b; }
.brand::after { content: '›'; color: #64748b; font-size: 18px; }

/* 面板 */
.panel { display: none; flex-direction: column; gap: 14px; margin-bottom: 18px; padding: 16px; background: #1e293b; border: 1px solid #334155; border-radius: 10px; }
.panel.show { display: flex; }
.row { display: flex; flex-direction: column; gap: 6px; }
label { font-size: 12px; color: #94a3b8; font-weight: 500; }
input, select { background: #0f172a; border: 1px solid #334155; color: #e2e8f0; padding: 9px 12px; border-radius: 8px; font-size: 13px; width: 100%; outline: none; transition: border-color .15s; }
input:focus, select:focus { border-color: #2563eb; }
input::placeholder { color: #475569; }

/* 操作按钮：统一右对齐 */
.btn-row { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
button.action { background: #2563eb; color: #fff; border: none; padding: 9px 20px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; transition: background .15s; }
button.action:hover { background: #1d4ed8; }
button.action.small { padding: 5px 12px; font-size: 12px; }

/* 行内表单：输入框 + 同高按钮横排 */
.inline-row { display: flex; align-items: stretch; gap: 12px; }
.inline-row input { flex: 1; }
.inline-row button.action { flex: none; }

/* 图形验证码：标题在上，图片在标题正下方，再下是输入框 + 按钮 */
#xiaomi-captcha .captcha-top { gap: 12px; }
#xiaomi-captcha .captcha-top .captcha-img { height: 40px; width: auto; align-self: flex-start; }
#xiaomi-captcha .captcha-input-row { margin-top: 14px; }

/* 行内多列：登录设备 / 地区 / 按钮一行 */
.row-inline { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.row-inline .row { flex: 1; min-width: 150px; }

/* 短信验证码：标题 + 手机号与输入框同一行垂直居中，手机号与输入框拉开距离 */
.verify-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.verify-title { font-size: 12px; color: #94a3b8; font-weight: 500; white-space: nowrap; }
.verify-phone { font-size: 13px; color: #e2e8f0; white-space: nowrap; word-break: break-all; }
.verify-row input { flex: 1; min-width: 140px; margin-left: 18px; }
.verify-row button.action { flex: none; }

/* 登录表单行间距：密码与上方小米 ID 拉开距离 */
#xiaomi-login .row + .row { margin-top: 10px; }

/* 表格 */
table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 2px; }
th, td { border: 1px solid #334155; padding: 8px 10px; text-align: left; word-break: break-word; }
th { background: #0f172a; color: #94a3b8; font-weight: 500; white-space: nowrap; }
td { vertical-align: middle; }

.captcha-img { max-width: 180px; border-radius: 8px; border: 1px solid #334155; }
#status { color: #22c55e; font-size: 12px; margin-top: 10px; min-height: 16px; }
#status.err { color: #ef4444; }
.hint { font-size: 11px; color: #64748b; line-height: 1.5; }
</style>
</head>
<body>
<h2>添加摄像头</h2>

<button class="brand" id="btn-manual">手动添加（输入视频流地址）</button>
<div class="panel" id="panel-manual">
  <div class="row">
    <label>流名称</label>
    <input id="m-name" placeholder="如 camera1">
  </div>
  <div class="row">
    <label>视频流地址（RTSP / HTTP）</label>
    <input id="m-src" placeholder="rtsp://user:password@192.168.1.100:554/stream">
  </div>
  <div class="btn-row">
    <button class="action" onclick="manualAdd()">添加</button>
  </div>
  <div class="hint">适用于已知视频流地址的用户，如海康 / 大华等品牌摄像头。</div>
</div>

<button class="brand" id="btn-xiaomi">小米 / 米家（账号登录）</button>
<div class="panel" id="panel-xiaomi">
  <!-- 登录 -->
  <div id="xiaomi-login">
    <div class="row">
      <label>小米 ID</label>
      <input id="xm-user" placeholder="请输入小米 ID">
    </div>
    <div class="row">
      <label>密码</label>
      <input id="xm-pass" type="password" placeholder="请输入密码">
    </div>
    <div class="btn-row">
      <button class="action" id="xm-login-btn" onclick="xiaomiLogin()">登录</button>
    </div>
  </div>
  <!-- 图形验证码：标题在上，图片在标题正下方，再下是输入框 + 按钮 -->
  <div id="xiaomi-captcha" style="display:none">
    <div class="row captcha-top">
      <label>图形验证码</label>
      <img id="xm-captcha-img" class="captcha-img">
    </div>
    <div class="inline-row captcha-input-row">
      <input id="xm-captcha" placeholder="输入图形验证码">
      <button class="action" onclick="xiaomiSend('captcha')">提交</button>
    </div>
  </div>
  <!-- 短信 / 邮箱验证码：标题 + 手机号与输入框同一行垂直居中 -->
  <div id="xiaomi-verify" style="display:none">
    <div class="verify-row">
      <span class="verify-title">请输入短信验证码</span>
      <span id="xm-verify-phone" class="verify-phone"></span>
      <input id="xm-verify" placeholder="输入验证码">
      <button class="action" onclick="xiaomiSend('verify')">提交</button>
    </div>
  </div>
  <!-- 设备列表：登录设备 / 地区 / 按钮一行，名称地址表格下一行 -->
  <div id="xiaomi-devices" style="display:none">
    <div class="row-inline">
      <div class="row">
        <label>登录设备</label>
        <select id="xm-device"></select>
      </div>
      <div class="row">
        <label>地区</label>
        <select id="xm-region">
          <option value="cn">中国</option>
          <option value="de">欧洲</option>
          <option value="i2">印度</option>
          <option value="ru">俄罗斯</option>
          <option value="sg">新加坡</option>
          <option value="us">美国</option>
        </select>
      </div>
      <button class="action" onclick="xiaomiLoadDevices()">加载设备列表</button>
    </div>
    <table><thead><tr><th>名称</th><th>地址</th><th></th></tr></thead><tbody id="xm-table"></tbody></table>
  </div>
</div>

<button class="brand" id="btn-onvif">ONVIF 自动发现（局域网）</button>
<div class="panel" id="panel-onvif">
  <div class="row">
    <label>ONVIF 设备地址（可选，留空自动扫描局域网）</label>
    <input id="onvif-src" placeholder="onvif://user:password@192.168.1.123:80">
  </div>
  <div class="btn-row">
    <button class="action" onclick="onvifScan()">扫描 / 测试</button>
  </div>
  <table><thead><tr><th>名称</th><th>地址</th><th></th></tr></thead><tbody id="onvif-table"></tbody></table>
</div>

<div id="status"></div>

<script>
const GO2RTC = 'http://' + (location.hostname || 'localhost') + ':1984';

function status(msg, isErr) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = isErr ? 'err' : '';
}

function togglePanel(panelId, btnId) {
  ['manual', 'xiaomi', 'onvif'].forEach(k => {
    document.getElementById('panel-' + k).classList.remove('show');
    document.getElementById('btn-' + k).classList.remove('active');
  });
  document.getElementById(panelId).classList.add('show');
  document.getElementById(btnId).classList.add('active');
}

document.getElementById('btn-manual').onclick = () => togglePanel('panel-manual', 'btn-manual');
document.getElementById('btn-xiaomi').onclick = () => togglePanel('panel-xiaomi', 'btn-xiaomi');
document.getElementById('btn-onvif').onclick = () => togglePanel('panel-onvif', 'btn-onvif');

// ── 通用：添加流并通知父窗口 ──
async function addStream(name, src) {
  const url = new URL(GO2RTC + '/api/streams');
  url.searchParams.set('name', name);
  url.searchParams.set('src', src);
  const r = await fetch(url, { method: 'PUT' });
  if (r.ok) {
    const rtsp = 'rtsp://' + (location.hostname || 'localhost') + ':8554/' + name;
    status('已添加「' + name + '」，RTSP 地址：' + rtsp);
    // 通知父窗口自动填入并保存
    window.parent.postMessage({ type: 'stream-added', name: name, rtsp: rtsp }, '*');
  } else {
    status('添加失败：' + (await r.text()), true);
  }
}

// ── 手动添加 ──
async function manualAdd() {
  const name = document.getElementById('m-name').value.trim();
  const src = document.getElementById('m-src').value.trim();
  if (!name || !src) { status('请填写流名称和地址', true); return; }
  await addStream(name, src);
}

// ── 小米 / 米家 ──
// 视图切换：login / captcha / verify / devices 互斥显示
function showXiaomiView(view) {
  ['xiaomi-login', 'xiaomi-captcha', 'xiaomi-verify', 'xiaomi-devices'].forEach(id => {
    document.getElementById(id).style.display = 'none';
  });
  if (view) document.getElementById(view).style.display = 'flex';
}

async function xiaomiLogin() {
  // 点击登录后隐藏登录按钮，避免重复提交
  const btn = document.getElementById('xm-login-btn');
  btn.style.display = 'none';
  status('登录中...');
  const body = new URLSearchParams();
  body.set('username', document.getElementById('xm-user').value.trim());
  body.set('password', document.getElementById('xm-pass').value);
  await xiaomiAuth(body);
}

async function xiaomiSend(type) {
  const body = new URLSearchParams();
  body.set(type, document.getElementById('xm-' + type).value.trim());
  await xiaomiAuth(body);
}

async function xiaomiAuth(body) {
  let r;
  try {
    r = await fetch(GO2RTC + '/api/xiaomi', { method: 'POST', body: body });
  } catch (e) {
    status('网络错误：' + e.message, true);
    showXiaomiView('xiaomi-login');
    const btn = document.getElementById('xm-login-btn');
    if (btn) btn.style.display = '';
    return;
  }
  if (r.status === 401) {
    const data = await r.json();
    if (data.captcha) {
      showXiaomiView('xiaomi-captcha');
      document.getElementById('xm-captcha-img').src = 'data:image/jpeg;base64,' + data.captcha;
    } else {
      showXiaomiView('xiaomi-verify');
      document.getElementById('xm-verify-phone').textContent = data.verify_phone || data.verify_email || '';
    }
  } else if (r.ok) {
    status('小米登录成功，加载账号中...');
    await xiaomiReload();
  } else {
    status('登录失败：' + (await r.text()), true);
    // 回到登录页，重新显示登录按钮
    showXiaomiView('xiaomi-login');
    const btn = document.getElementById('xm-login-btn');
    if (btn) btn.style.display = '';
  }
}

async function xiaomiReload() {
  try {
    const r = await fetch(GO2RTC + '/api/xiaomi', { cache: 'no-cache' });
    const data = await r.json();
    // 过滤空账号（go2rtc 登录异常时可能写入空 key，导致下拉出现空选项）
    const accounts = (Array.isArray(data) ? data : []).filter(s => s && String(s).trim());
    const select = document.getElementById('xm-device');
    select.innerHTML = accounts.map(item => '<option value="' + item + '">' + item + '</option>').join('');
    if (!accounts.length) {
      status('登录成功但账号未正确保存，请重新登录', true);
      return;
    }
    status('小米登录成功，请选择账号并加载设备');
    showXiaomiView('xiaomi-devices');
  } catch (e) {
    status('加载账号失败：' + e.message, true);
  }
}

async function xiaomiLoadDevices() {
  const params = new URLSearchParams({
    id: document.getElementById('xm-device').value,
    region: document.getElementById('xm-region').value,
  });
  const r = await fetch(GO2RTC + '/api/xiaomi?' + params.toString(), { cache: 'no-cache' });
  if (!r.ok) { status('加载失败：' + (await r.text()), true); return; }
  const data = await r.json();
  renderDevices('xm-table', data.sources || []);
}

// ── ONVIF ──
async function onvifScan() {
  const table = document.getElementById('onvif-table');
  table.innerHTML = '';
  const src = document.getElementById('onvif-src').value.trim();
  const url = new URL(GO2RTC + '/api/onvif');
  if (src) url.searchParams.set('src', src);
  const r = await fetch(url.toString(), { cache: 'no-cache' });
  if (!r.ok) { status('ONVIF 扫描失败：' + (await r.text()), true); return; }
  const data = await r.json();
  renderDevices('onvif-table', data.sources || []);
}

function renderDevices(tableId, sources) {
  const tbody = document.getElementById(tableId);
  tbody.innerHTML = '';
  if (!sources.length) { status('未发现设备', true); return; }
  sources.forEach(s => {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td>' + (s.name || '') + '</td><td>' + (s.url || '') + '</td>' +
      '<td><button class="action small" onclick="addStream(\'' + (s.id || 'cam') + '\', \'' + (s.url || '') + '\')">添加</button></td>';
    tbody.appendChild(tr);
  });
  status('发现 ' + sources.length + ' 个设备');
}
</script>
</body>
</html>
